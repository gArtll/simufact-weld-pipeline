# Data files allowed in the public repository. tools/check_private_data.py fails on any tracked file with a data
# extension (see DATA_EXT there) that no entry below matches, and always on solver decks, results, tooling geometry,
# material cards and project files (NEVER_EXT). Adding a file here is a statement about its origin and licence:
# register only data that is synthetic (generated by a script in this repository from made-up values) or a code
# template. Data of real models -- the owner's own included, until their publication is cleared -- stays out.
#
# category: synthetic      generated by a script in this repository from made-up parameters (figures included)
#           code_data      a file the code reads as configuration or a template, not model data
#           owner_cleared  a picture of a real part that the owner of that part has cleared for publication, with the
#                          internal name removed. The data it was drawn from stays out of this repository, and so
#                          does the script that drew it (it reads paths outside the repository). One entry per file,
#                          never a glob: a new file is a new decision.
entries:
  - glob: cases/example_synthetic/inputs/*.bdf
    category: synthetic
    origin: cases/example_synthetic/make_example.py
  - glob: cases/example_synthetic/inputs/*.csv
    category: synthetic
    origin: cases/example_synthetic/make_example.py
  - glob: cases/example_synthetic/inputs/*.xml
    category: synthetic
    origin: cases/synthetic_xml.py via make_example.py (not a Simufact export)
  - glob: cases/example_synthetic.json
    category: synthetic
    origin: regression case definition of the synthetic web-on-plate example
  - glob: cases/example_tube_synthetic/inputs/*.bdf
    category: synthetic
    origin: cases/example_tube_synthetic/make_example.py
  - glob: cases/example_tube_synthetic/inputs/*.csv
    category: synthetic
    origin: cases/example_tube_synthetic/make_example.py
  - glob: cases/example_tube_synthetic/inputs/*.xml
    category: synthetic
    origin: cases/synthetic_xml.py via make_example.py (not a Simufact export)
  - glob: cases/example_tube_synthetic.json
    category: synthetic
    origin: regression case definition of the synthetic tube-on-plate example
  - glob: tests/failure_logs/synthetic_*
    category: synthetic
    origin: tests/failure_logs/make_synthetic.py
  - glob: library/参数库_v1.csv
    category: code_data
    origin: parameter library schema (header row only; rows of real studies are kept outside the public repository)
  - glob: docs/images/transition_templates.png
    category: synthetic
    origin: tools/make_mesh_figures.py (meshes built by mesh_transition, drawn with matplotlib)
  - glob: docs/images/transition_vs_unstructured.png
    category: synthetic
    origin: tools/make_mesh_figures.py (template mesh from mesh_transition, comparison mesh from gmsh)
  - glob: docs/images/graded_vs_uniform.png
    category: synthetic
    origin: tools/make_mesh_figures.py (meshes built by mesh_transition, drawn with matplotlib)
  - glob: docs/images/real_part_automatic_vs_explicit.png
    category: owner_cleared
    origin: 300 x 70 mm of the web face of a real part, meshed by HyperMesh automesh and by this tool. Cleared for
      publication by the owner of the part on 2026-10-24, with the internal model name and the element counts
      removed; the meshes themselves, the CAD and the rest of that study are not in this repository
  - glob: common/case_template.json
    category: code_data
    origin: blank case template of `weldsim.py new`
  - glob: prep/mesh_bead.tcl
    category: code_data
    origin: HyperMesh Tcl mesher (code)
